name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"

      - name: Vet
        run: go vet -all ./...

      - name: Compile with vet enabled
        run: go test -vet=all -run=^$ ./...

      - name: Verify modules
        run: go mod verify

      - name: Test with race detector
        run: go test -race ./...

      - name: Build
        run: go build -buildvcs=false ./cmd/miodesk

      - name: Cross-compile release platforms
        shell: bash
        run: |
          set -euo pipefail
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${target%/*}
            arch=${target#*/}
            suffix=""
            if [[ "$os" == windows ]]; then suffix=".exe"; fi
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -buildvcs=false \
              -o "$RUNNER_TEMP/miodesk-${os}-${arch}${suffix}" ./cmd/miodesk
          done

      - name: Test installer
        run: scripts/install-test.sh

      - name: Test fresh-user onboarding and MCP startup
        run: bash scripts/onboarding-test.sh

      - name: Test optional Code Mode MCP roundtrip
        run: bash scripts/codemode-smoke/ci.sh
