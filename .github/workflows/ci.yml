name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"

      - name: Validate local documentation links
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          failures = []
          docs = [Path('README.md'), Path('AGENTS.md'), Path('CHANGELOG.md')]
          docs += list(Path('docs').rglob('*.md'))
          docs += list(Path('plugins').rglob('*.md'))
          for doc in docs:
              text = doc.read_text(encoding='utf-8')
              links = re.findall(r'\]\(([^)]+)\)', text)
              links += re.findall(r'<(?:img|a)\b[^>]*\b(?:src|href)="([^"]+)"', text)
              for link in links:
                  if link.startswith(('https://', 'http://', 'mailto:', '#')):
                      continue
                  target = link.split('#', 1)[0]
                  if target and not (doc.parent / target).exists():
                      failures.append(f'{doc}: {link}')
          if failures:
              raise SystemExit('Broken documentation links:\n' + '\n'.join(failures))
          print(f'[OK] relative links checked in {len(docs)} Markdown files')
          PY

      - name: Vet
        run: go vet -all ./...

      - name: Compile with vet enabled
        run: go test -vet=all -run=^$ ./...

      - name: Verify modules
        run: go mod verify

      - name: Test with race detector
        run: go test -race ./...

      - name: Build
        run: go build -buildvcs=false ./cmd/miodesk

      - name: Cross-compile release platforms
        shell: bash
        run: |
          set -euo pipefail
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${target%/*}
            arch=${target#*/}
            suffix=""
            if [[ "$os" == windows ]]; then suffix=".exe"; fi
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -buildvcs=false \
              -o "$RUNNER_TEMP/miodesk-${os}-${arch}${suffix}" ./cmd/miodesk
          done

      - name: Test installer
        run: scripts/install-test.sh

      - name: Test fresh-user onboarding and MCP startup
        run: bash scripts/onboarding-test.sh

      - name: Test optional Code Mode MCP roundtrip
        run: bash scripts/codemode-smoke/ci.sh
